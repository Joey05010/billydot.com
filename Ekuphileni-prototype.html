<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekuphileni Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Open+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --accent: #22A35A;
            --hint: #2E9E4F;
            --hint-fill: rgba(46, 158, 79, 0.22);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Open Sans', sans-serif;
            color: var(--text);
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                        url('assets/bg.png') no-repeat center center fixed;
            background-size: cover;
        }
        a { color: inherit; }

        .top { display: flex; justify-content: space-between; align-items: center; max-width: 1040px; margin: 0 auto; padding: 20px 16px 0; font-size: 0.85rem; gap: 12px; }
        .top a { text-decoration: none; opacity: 0.85; }
        .top a:hover { opacity: 1; }
        .hint-toggle { background: transparent; border: 1px solid var(--glass-border); color: var(--text); border-radius: 20px; padding: 6px 14px; font: inherit; cursor: pointer; }
        .hint-toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }

        .layout { display: grid; grid-template-columns: 1fr 380px; gap: 48px; max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; align-items: start; }

        /* PHONE */
        .phone-wrap { display: flex; justify-content: center; }
        .phone {
            width: min(380px, 100%);
            background: #121214;
            border-radius: 52px;
            padding: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.45), inset 0 0 0 2px #46464c;
        }
        .screen { position: relative; border-radius: 40px; overflow: hidden; aspect-ratio: 393 / 852; background: #F3F2EC; }
        .scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .scroller::-webkit-scrollbar { display: none; }
        .stage { position: relative; width: 393px; transform-origin: 0 0; }
        .stage > img { display: block; width: 393px; height: auto; user-select: none; -webkit-user-drag: none; }

        /* Filled-in values */
        .fill { position: absolute; display: flex; align-items: center; padding-left: 9px; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; color: #fff; white-space: nowrap; overflow: hidden; pointer-events: none; }
        .fill.empty { visibility: hidden; }
        .patch { position: absolute; pointer-events: none; background-repeat: no-repeat; }
        .patch.off { display: none; }
        .fill.area { align-items: flex-start; padding: 9px 10px; white-space: normal; line-height: 1.45; }
        .digit { position: absolute; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 26px; color: #fff; pointer-events: none; }
        .digit.dot { font-size: 40px; line-height: 0; }
        .digit:empty { display: none; }
        .digit.pop, .tick.pop { animation: pop .18s ease-out; }
        @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .tick { position: absolute; pointer-events: none; }
        .tick.off { display: none; }
        .caret::after { content: ''; display: inline-block; width: 1.5px; height: 18px; background: #fff; margin-left: 1px; animation: blink .8s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Buttons that unlock once fields are filled */
        .btn-on {
            position: absolute; display: flex; align-items: center; justify-content: center;
            background: #0760DE; border: 3px solid #1069E4; border-radius: 8px;
            font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 20px; color: #fff;
            pointer-events: none; animation: pop .2s ease-out;
        }

        /* Fingerprint scan */
        .scan-ring { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; }
        .scan-ring.on { animation: scan 1.1s ease-out; }
        @keyframes scan {
            0% { opacity: 1; box-shadow: 0 0 0 0 rgba(125, 211, 252, .7), inset 0 0 40px rgba(125, 211, 252, .35); }
            100% { opacity: 1; box-shadow: 0 0 0 26px rgba(125, 211, 252, 0), inset 0 0 90px rgba(125, 211, 252, .55); }
        }

        /* Tap areas */
        .hotspot { position: absolute; border-radius: 10px; cursor: pointer; background: transparent; border: 0; padding: 0; }
        .hotspot:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }
        .hotspot.next { box-shadow: 0 0 0 2px var(--hint); animation: guide 1.6s ease-in-out infinite; }
        @keyframes guide { 50% { box-shadow: 0 0 0 5px rgba(46, 158, 79, .3); } }
        .show-hints .hotspot, .flash .hotspot, .hotspot.need {
            background: var(--hint-fill);
            box-shadow: 0 0 0 2px var(--hint);
        }
        .flash .hotspot, .hotspot.need { animation: pulse .7s ease 2; }
        @keyframes pulse { 50% { background: rgba(46, 158, 79, 0.42); } }

        .toast {
            position: absolute; left: 50%; bottom: 6%; transform: translate(-50%, 20px);
            background: rgba(10, 10, 20, 0.92); color: #fff; padding: 10px 18px; border-radius: 22px;
            font-size: 0.82rem; opacity: 0; transition: .25s ease; z-index: 6; pointer-events: none;
            max-width: 88%; text-align: center;
        }
        .toast.on { opacity: 1; transform: translate(-50%, 0); }

        .scroll-chip {
            position: absolute; right: 4%; bottom: 2.5%;
            background: #283A8C; color: #fff; font-family: 'Inter', sans-serif; font-weight: 600;
            font-size: 0.75rem; padding: 7px 14px; border-radius: 20px; z-index: 5; pointer-events: none;
            transition: opacity .25s; opacity: 0;
        }
        .scroll-chip.on { opacity: 1; animation: nudge 1.4s ease-in-out infinite; }
        @keyframes nudge { 50% { transform: translateY(4px); } }

        .scene {
            position: absolute; inset: 0; z-index: 8;
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 0 28px; gap: 18px;
            background: linear-gradient(180deg, #F3F2EC 0%, #F3F2EC 35%, #CFE3BD 70%, #7AB051 100%);
            color: #1a1a1a;
        }
        .scene.on { display: flex; }
        .scene .tag { font-family: 'Press Start 2P', cursive; font-size: 0.6rem; letter-spacing: 1px; opacity: 0.85; }
        .scene h3 { margin: 0; font-family: Georgia, serif; font-weight: normal; font-size: 1.5rem; line-height: 1.3; }
        .scene p { margin: 0; font-size: 0.95rem; line-height: 1.5; opacity: 0.9; }
        .scene button {
            margin-top: 6px; background: #283A8C; color: #fff; border: 0; border-radius: 22px;
            padding: 14px 28px; font-weight: 700; letter-spacing: 1px; font-size: 0.85rem; cursor: pointer; font-family: 'Inter', sans-serif;
        }

        /* SIDE PANEL */
        .panel {
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 28px;
            position: sticky; top: 24px;
        }
        .panel h1 { font-family: Georgia, serif; font-weight: normal; font-size: 1.6rem; margin: 0 0 6px; }
        .panel .sub { opacity: 0.75; font-size: 0.85rem; margin: 0 0 22px; }
        .now { border-left: 3px solid var(--accent); padding-left: 14px; margin-bottom: 22px; }
        .now small { display: block; font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: #7EDC9C; margin-bottom: 4px; }
        .now b { display: block; font-family: Georgia, serif; font-weight: normal; font-size: 1.15rem; margin-bottom: 4px; }
        .now span { font-size: 0.9rem; opacity: 0.85; line-height: 1.5; display: block; }
        .now em { display: block; margin-top: 10px; font-style: normal; font-size: 0.8rem; color: #7EDC9C; }
        .steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
        .steps li { counter-increment: s; }
        .steps li.group { counter-increment: none; font-size: 0.68rem; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.6; padding: 12px 8px 4px; }
        .steps button {
            width: 100%; text-align: left; background: transparent; border: 0; color: var(--text);
            font: inherit; font-size: 0.85rem; padding: 6px 8px; border-radius: 8px; cursor: pointer; opacity: 0.7;
            display: flex; gap: 10px; align-items: center;
        }
        .steps button::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--glass-border); display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; }
        .steps button:hover { opacity: 1; background: rgba(255,255,255,0.06); }
        .steps button[aria-current="step"] { opacity: 1; background: rgba(34, 163, 90, 0.22); }
        .steps button[aria-current="step"]::before { background: var(--accent); border-color: var(--accent); }
        .restart { margin-top: 18px; background: transparent; border: 1px solid white; color: white; border-radius: 25px; padding: 9px 26px; font: inherit; font-weight: 600; cursor: pointer; }
        .restart:hover { background: white; color: black; }

        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; gap: 24px; }
            .panel { position: static; }
            .steps { display: none; }
        }
    </style>
</head>
<body>

    <div class="top">
        <a href="Phile.html">&larr; Back to case study</a>
        <button class="hint-toggle" id="hintToggle" aria-pressed="false">Show tap areas</button>
    </div>

    <main class="layout">
        <div class="phone-wrap">
            <div class="phone">
                <div class="screen" id="screen">
                    <div class="scroller" id="scroller">
                        <div id="sizer"><div class="stage" id="stage"></div></div>
                    </div>
                    <div class="scroll-chip" id="scrollChip">Scroll &darr;</div>
                    <div class="toast" id="toast"></div>
                    <div class="scene" id="scene" role="dialog" aria-live="polite">
                        <div class="tag" id="sceneTag"></div>
                        <h3 id="sceneTitle"></h3>
                        <p id="sceneText"></p>
                        <button id="sceneBtn"></button>
                    </div>
                </div>
            </div>
        </div>

        <aside class="panel">
            <h1>Ekuphileni pharmacy</h1>
            <p class="sub">Clinic app &middot; clickable prototype of ordering medication for pickup. Tap a field to fill it in, tap buttons to move on, or jump to any step.</p>
            <div class="now" id="now"><small></small><b></b><span></span><em></em></div>
            <ol class="steps" id="steps"></ol>
            <button class="restart" id="restart">Restart</button>
        </aside>
    </main>

        const STEPS = [["start", "Order your medication", "nonp"], ["#", "Non-prescription order"], ["nonp-list", "Browse medicines", "nonp"], ["nonp-product", "Product details", "nonp"], ["nonp-added", "Add to basket", "nonp"], ["patient", "Patient details", "nonp"], ["confirm", "Review and pay", "nonp"], ["confirmed", "Order confirmed", "nonp"], ["#", "Prescription order"], ["rx-patient", "Patient details", "rx"], ["rx-doctor", "Choose your doctor", "rx"], ["rx-list", "Browse prescriptions", "rx"], ["rx-product", "Product details", "rx"], ["rx-added", "Add to basket", "rx"], ["rx-confirm", "Review and pay", "rx"], ["rx-confirmed", "Order confirmed", "rx"]];
        const SCENES = {"bridge": {"tag": "ORDER PLACED", "title": "Non-prescription order done", "text": "Next, a prescription order. It adds the patient's details and the doctor who prescribed the medicine.", "btn": "CONTINUE TO PRESCRIPTION ORDER", "go": "start", "phase": "rx", "reset": true}, "final": {"tag": "JOURNEY COMPLETE", "title": "That's the full ordering journey", "text": "Two ways to get medication ready for pickup: a quick non-prescription order, and a prescription order that adds the patient's details and their doctor.", "btn": "START AGAIN", "restart": true}};
        const W = 393;
        const IMG = n => `assets/Phile/proto/${n}.jpg`;

        const $ = id => document.getElementById(id);
        const screenEl = $('screen'), scroller = $('scroller'), sizer = $('sizer'), stage = $('stage');

        let current = null, stack = [], filled = {}, timers = [], phase = null;
        const REAL_STEPS = STEPS.filter(([k]) => k !== '#');
        const STEP_INDEX = Object.fromEntries(REAL_STEPS.map(([k], i) => [k, i]));
        const PHASE_OF = Object.fromEntries(REAL_STEPS.map(([k, , p]) => [k, p]));
        phase = REAL_STEPS[0][2];
        const fieldEls = {};

        Object.values(SCREENS).forEach(s => { const i = new Image(); i.src = IMG(s.img); });

        const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
        const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
        const sleep = ms => new Promise(r => later(r, ms));
        const place = (el, [x1, y1, x2, y2], inset = 0) => Object.assign(el.style, {
            left: (x1 + inset) + 'px', top: (y1 + inset) + 'px',
            width: (x2 - x1 - 2 * inset) + 'px', height: (y2 - y1 - 2 * inset) + 'px'
        });

        function layout() {
            const s = SCREENS[current]; if (!s) return;
            const k = scroller.clientWidth / W;

            stage.style.height = s.h + 'px';
            sizer.style.height = (s.h * k) + 'px';

        }
        new ResizeObserver(layout).observe(scroller);

        function updateChip() {
            // Only hint at the start of a long screen; hide as soon as people scroll
            $('scrollChip').classList.toggle('on', scroller.scrollHeight > scroller.clientHeight + 40 && scroller.scrollTop < 60);
        }
        scroller.addEventListener('scroll', updateChip, { passive: true });

        };
        const groupOf = f => f.group
            ? (SCREENS[current].fields || []).filter(g => g.group === f.group)
            : [f];
        const ready = h => (h.needs || []).every(id => filled[id]);

        function show(key, opts = {}) {

            const s = SCREENS[key];
            $('scene').classList.remove('on');

                    el.setAttribute('viewBox', '0 0 20 20');

                    el.innerHTML = `<polyline points="4,10.5 8.5,15 16,5.5" fill="none" stroke="${f.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
                    place(el, f.box);

                fieldEls[f.id] = el;

            (s.labels || []).forEach(l => {

                place(el, l.box);

            if (s.hot.some(h => h.scan)) {
                const ring = document.createElement('div');
                ring.className = 'scan-ring'; ring.id = 'scanRing';
                place(ring, s.hot.find(h => h.scan).box);
                stage.appendChild(ring);
            }

            // Tap-to-fill areas for text fields and code boxes
            (s.fields || []).filter(f => f.kind !== 'check' && f.kind !== 'radio').forEach(f => {
                stage.appendChild(hotspot({ box: f.box, field: f.id, label: 'Fill in ' + (f.group || f.id) }));
            });

            renderButtons();

            scroller.scrollTop = 0;

            // Screens shared by both orders guide people to the right next tap for the order in progress

            now.querySelector('b').textContent = s.title;

            d.className = 'patch';
            Object.assign(d.style, {

        function renderButtons() {
            stage.querySelectorAll('.btn-on, .btn-patch').forEach(n => n.remove());
            SCREENS[current].hot.filter(h => (h.btn || h.patch) && ready(h)).forEach(h => {
                let d;
                if (h.patch) { d = patch(h.patch, h.box); d.classList.add('btn-patch'); d.style.animation = 'pop .2s ease-out'; }
                else { d = document.createElement('div'); d.className = 'btn-on'; d.textContent = h.btn; place(d, h.box); }
                stage.insertBefore(d, stage.querySelector('.hotspot'));

        async function fillOne(f, fast) {
            if (filled[f.id]) return;
            filled[f.id] = true;
            const el = fieldEls[f.id];
            if (!el) return;
            if (f.kind === 'text' || f.kind === 'area') {
                el.classList.remove('empty');

                const step = fast ? 6 : (f.kind === 'area' ? 18 : 34);

                el.classList.remove('off'); el.classList.add('pop');
